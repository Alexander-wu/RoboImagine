[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "roboimagine"
version = "0.1.0"
description = "Robotic world models with semantic and visual feedback"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26,<3", "torch>=2.6,<2.11", "torchvision", "transformers==4.57.1", "diffusers==0.35.2", "safetensors>=0.6", "einops==0.8.1", "Pillow>=10", "sentencepiece>=0.2", "protobuf>=4", "huggingface_hub>=0.34,<1", "imageio[ffmpeg]>=2.34"]

[project.optional-dependencies]
evaluation = ["lpips==0.1.4", "piqa==1.3.2"]
notebook = ["jupyterlab", "ipykernel"]

[project.scripts]
roboimagine = "roboimagine.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
